name: Enterprise CI Pipeline

# 1. Kích hoạt tự động khi có Pull Request vào nhánh 'main' hoặc 'develop'
on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality-assurance:
    name: Kiểm tra Chất lượng Mã nguồn
    runs-on: ubuntu-latest # Cấp phát máy chủ ảo Linux từ GitHub

    steps:
    - name: 📥 Tải mã nguồn về máy chủ ảo
      uses: actions/checkout@v3

    - name: ⚙️ Cài đặt môi trường Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: 🔍 Kiểm tra Tiêu chuẩn Cú pháp (Linter)
      run: npm run lint
      
    # [BỔ SUNG] - Giả lập gửi thông báo (Webhook)
    - name: 🔔 Gửi thông báo đến kênh Slack/Discord của Team
      if: success()
      run: |
        echo "Gửi Webhook: PR mới đã vượt qua vòng kiểm tra tự động. Đội ngũ Reviewer có thể tiến hành kiểm tra logic."